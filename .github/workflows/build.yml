name: Build
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find project (zip or plain)
        run: |
          set -e
          if [ -f settings.gradle ] || [ -f settings.gradle.kts ]; then
            ROOT="$PWD"
          else
            Z=$(ls -t ./*.zip 2>/dev/null | head -n 1)
            [ -n "$Z" ] || { echo "No zip file and no settings.gradle in repo root"; ls -la; exit 1; }
            echo "Using: $Z"
            mkdir -p "$RUNNER_TEMP/src"
            unzip -q -o "$Z" -d "$RUNNER_TEMP/src"
            S=$(find "$RUNNER_TEMP/src" \( -name settings.gradle -o -name settings.gradle.kts \) -not -path '*/build/*' | head -n 1)
            [ -n "$S" ] || { echo "settings.gradle not found inside zip"; find "$RUNNER_TEMP/src" | head -50; exit 1; }
            ROOT=$(dirname "$S")
          fi
          echo "PROJECT_DIR=$ROOT" >> "$GITHUB_ENV"
          echo "Project dir: $ROOT"

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }

      - name: Keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_B64 }}" ]; then
            echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > $RUNNER_TEMP/release.jks
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            keytool -genkeypair -keystore $RUNNER_TEMP/release.jks -storepass nawelny123 -keypass nawelny123 -alias nawelny -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Nawelny"
            echo "KEYSTORE_PASSWORD=nawelny123" >> $GITHUB_ENV
            echo "KEY_ALIAS=nawelny" >> $GITHUB_ENV
            echo "KEY_PASSWORD=nawelny123" >> $GITHUB_ENV
          fi
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> $GITHUB_ENV

      - name: Build
        run: cd "$PROJECT_DIR" && gradle assembleRelease bundleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: nawelny
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
            ${{ env.PROJECT_DIR }}/app/build/outputs/bundle/release/*.aab
