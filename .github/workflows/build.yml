name: Build APK + AAB
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find project (zip or plain)
        run: |
          set -e
          if [ -f settings.gradle ] || [ -f settings.gradle.kts ]; then
            ROOT="$PWD"
          else
            Z=$(ls -t ./*.zip 2>/dev/null | head -n 1)
            [ -n "$Z" ] || { echo "No zip file and no settings.gradle in repo root"; ls -la; exit 1; }
            echo "Using: $Z"
            mkdir -p "$RUNNER_TEMP/src"
            unzip -q -o "$Z" -d "$RUNNER_TEMP/src"
            S=$(find "$RUNNER_TEMP/src" \( -name settings.gradle -o -name settings.gradle.kts \) -not -path '*/build/*' | head -n 1)
            [ -n "$S" ] || { echo "settings.gradle not found inside zip"; find "$RUNNER_TEMP/src" | head -50; exit 1; }
            ROOT=$(dirname "$S")
          fi
          echo "PROJECT_DIR=$ROOT" >> "$GITHUB_ENV"
          echo "Project dir: $ROOT"

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.11.1" }

      - name: Keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          S_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          S_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          S_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PASSWORD=$S_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$S_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$S_KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "No KEYSTORE_B64 secret: using the project keystore"
            echo "KEYSTORE_PASSWORD=nawelny123" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=nawelny" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=nawelny123" >> "$GITHUB_ENV"
            cp "$PROJECT_DIR/app/nawelny.jks" "$RUNNER_TEMP/release.jks"
          fi
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build APK + AAB
        run: |
          cd "$PROJECT_DIR"
          set +e
          gradle assembleRelease bundleRelease --stacktrace --no-daemon --console=plain > "$RUNNER_TEMP/build.log" 2>&1
          CODE=$?
          if [ $CODE -ne 0 ]; then
            echo "::error::BUILD FAILED"
            echo "=============== COMPILE ERRORS (lines starting with e:) ==============="
            grep -E "^e: " "$RUNNER_TEMP/build.log" | head -60
            echo "=============== WHAT WENT WRONG ==============="
            grep -A8 "What went wrong" "$RUNNER_TEMP/build.log" | head -40
          fi
          exit $CODE

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: ${{ runner.temp }}/build.log

      - uses: actions/upload-artifact@v4
        with:
          name: nawelny-release
          if-no-files-found: error
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
            ${{ env.PROJECT_DIR }}/app/build/outputs/bundle/release/*.aab
