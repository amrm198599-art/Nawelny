name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: فك الضغط وتحديد مجلد المشروع
        run: |
          if [ -f Nawelny.zip ]; then
            unzip -q -o Nawelny.zip
          fi
          SETTINGS=$(find . -maxdepth 3 \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -not -path './.git/*' | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "لم يتم العثور على settings.gradle"; ls -R | head -50; exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Project dir: $PROJECT_DIR"
          ls "$PROJECT_DIR"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SECRET_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "استخدام keystore ثابت من Secrets"
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore.jks"
            echo "KEYSTORE_PASSWORD=$SECRET_KS_PASS" >> $GITHUB_ENV
            echo "KEY_ALIAS=$SECRET_KEY_ALIAS" >> $GITHUB_ENV
            echo "KEY_PASSWORD=$SECRET_KEY_PASS" >> $GITHUB_ENV
          else
            echo "إنشاء keystore مؤقت (للتجربة فقط)"
            PASS=$(openssl rand -hex 12)
            keytool -genkeypair -keystore "$RUNNER_TEMP/keystore.jks" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias nawelny -storepass "$PASS" -keypass "$PASS" \
              -dname "CN=Nawelny, O=Nawelny, C=EG"
            echo "KEYSTORE_PASSWORD=$PASS" >> $GITHUB_ENV
            echo "KEY_ALIAS=nawelny" >> $GITHUB_ENV
            echo "KEY_PASSWORD=$PASS" >> $GITHUB_ENV
          fi
          echo "KEYSTORE_FILE=$RUNNER_TEMP/keystore.jks" >> $GITHUB_ENV

      - name: سكربت التوقيع (بدون تعديل build.gradle)
        run: |
          cat > "$RUNNER_TEMP/sign.gradle" <<'EOF'
          allprojects {
            afterEvaluate { p ->
              if (p.plugins.hasPlugin('com.android.application')) {
                def android = p.extensions.getByName('android')
                def cfg = android.signingConfigs.create('ciRelease')
                cfg.storeFile = new File(System.getenv('KEYSTORE_FILE'))
                cfg.storePassword = System.getenv('KEYSTORE_PASSWORD')
                cfg.keyAlias = System.getenv('KEY_ALIAS')
                cfg.keyPassword = System.getenv('KEY_PASSWORD')
                android.buildTypes.getByName('release').signingConfig = cfg
              }
            }
          }
          EOF

      - name: البناء
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleRelease bundleRelease --init-script "$RUNNER_TEMP/sign.gradle" --stacktrace
          else
            gradle assembleRelease bundleRelease --init-script "$RUNNER_TEMP/sign.gradle" --stacktrace
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: nawelny
          if-no-files-found: error
          path: |
            ${{ env.PROJECT_DIR }}/**/build/outputs/apk/release/*.apk
            ${{ env.PROJECT_DIR }}/**/build/outputs/bundle/release/*.aab
